<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Statistics Widget with HTML &amp; CSS 💰 | Modern Dashboard UI</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="sales-widget">
  <div class="widget-header">
    <div>
      <p class="eyebrow">SALES OVERVIEW</p>
      <h1>Monthly Sales</h1>
    </div>

    <button class="menu-button" type="button" aria-label="More options">
      •••
    </button>
  </div>

  <div class="sales-summary">
    <div>
      <span class="summary-label">Total Revenue</span>
      <strong>$24,680</strong>
      <small>↗ 24.8% vs last month</small>
    </div>

    <div class="sales-chart">
      <div class="chart-center">
        <strong>78%</strong>
        <span>Target</span>
      </div>
    </div>
  </div>

  <div class="target-progress">
    <div class="progress-label">
      <span>Monthly target</span>
      <strong>$31,500</strong>
    </div>

    <div class="progress-track">
      <span></span>
    </div>
  </div>

  <div class="sales-breakdown">
    <div class="breakdown-item">
      <span class="breakdown-icon blue">▣</span>
      <div>
        <strong>Online Sales</strong>
        <small>$15,420 · 62%</small>
      </div>
    </div>

    <div class="breakdown-item">
      <span class="breakdown-icon purple">◆</span>
      <div>
        <strong>Store Sales</strong>
        <small>$9,260 · 38%</small>
      </div>
    </div>
  </div>

  <div class="weekly-sales">
    <div class="week-header">
      <strong>Weekly Performance</strong>
      <span>Last 7 days</span>
    </div>

    <div class="mini-bars">
      <div class="mini-bar-column">
        <span class="mini-bar" style="height: 42%"></span>
        <small>M</small>
      </div>

      <div class="mini-bar-column">
        <span class="mini-bar" style="height: 62%"></span>
        <small>T</small>
      </div>

      <div class="mini-bar-column">
        <span class="mini-bar" style="height: 48%"></span>
        <small>W</small>
      </div>

      <div class="mini-bar-column">
        <span class="mini-bar" style="height: 78%"></span>
        <small>T</small>
      </div>

      <div class="mini-bar-column">
        <span class="mini-bar" style="height: 60%"></span>
        <small>F</small>
      </div>

      <div class="mini-bar-column">
        <span class="mini-bar active" style="height: 91%"></span>
        <small>S</small>
      </div>

      <div class="mini-bar-column">
        <span class="mini-bar" style="height: 72%"></span>
        <small>S</small>
      </div>
    </div>
  </div>
</div>
</body>
</html>
